services:

  web:
    image: ghcr.io/bharath2498/company-backend:latest
    container_name: bharath-django-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
    expose:
      - "8000"
    depends_on:
      - db
    volumes:
      - static_data:/app/staticfiles
  db:
    image: postgres:18
    container_name: bharath-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql

  nginx:
    image: nginx:latest
    container_name: bharath-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro
    depends_on:
      - web
  redis:
    image: redis:7-alpine
    container_name: bharath-redis
    restart: unless-stopped
volumes:
  postgres_data:
  static_data:
